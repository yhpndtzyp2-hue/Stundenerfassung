<style>
/* Layout: one narrow phone column, large-title screens, 3-tab bar, entry form as bottom sheet.
   Black, baby blue and white: white = Arbeitszeit, baby blue = Verdienst and actions, grey = Uhrzeit. */
:root {
  --bg: #000000;
  --surface: #141414;
  --surface2: #222222;
  --fg: #FFFFFF;
  --muted: #8C8C8C;
  --line: #2B2B2B;
  --accent: #89CFF0;
  --accent-fg: #000000;
  --accent-soft: #10232D;
  --clock: #BDBDBD;
  --time: #FFFFFF;
  --money: #89CFF0;
  --danger: #FF6B6B;
  --danger-soft: #2A1414;
  --scrim: rgba(0, 0, 0, .7);
  --font-ui: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, system-ui, sans-serif;
  --radius: 18px;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--font-ui); font-size: 16px; line-height: 1.4; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: -.01em; }

.app { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); }
.screen { display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 8px; }
.top h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
.sub { color: var(--muted); font-size: 15px; margin-top: 2px; }
.round { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; flex: none; }
.round svg { width: 22px; height: 22px; }

/* Summary blocks on Heute */
.sum { background: var(--surface); border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.sum-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.sum-label span:last-child { letter-spacing: .02em; text-transform: none; font-weight: 500; }
.sum-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sum-time { font-size: 34px; line-height: 1.05; color: var(--time); }
.sum-money { font-size: 22px; color: var(--money); }
.sum.hero { padding: 20px 18px; }
.sum.hero .sum-time { font-size: 52px; }
.sum.hero .sum-money { font-size: 28px; }
.unit { font-size: .55em; font-weight: 700; color: inherit; opacity: .7; margin-left: 3px; }

.cta { width: 100%; min-height: 60px; border-radius: 16px; background: var(--accent); color: var(--accent-fg); font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }
.cta svg { width: 22px; height: 22px; }
.cta:active, .round:active { transform: scale(.98); }

.hint { font-size: 14px; color: var(--muted); background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; }
.hint button { color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

.section-title { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 4px -6px; }

/* Period navigation */
.pager { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 14px; padding: 4px; }
.pager button.arrow { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; color: var(--accent); flex: none; }
.pager button.arrow svg { width: 20px; height: 20px; }
.pager .mid { flex: 1; min-width: 0; text-align: center; min-height: 44px; display: flex; flex-direction: column; justify-content: center; border-radius: 10px; }
.pager .mid b { font-size: 16px; }
.pager .mid small { color: var(--muted); font-size: 13px; }

.formula { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Day rows: date | Uhrzeit | Arbeitszeit + Verdienst */
.days { display: flex; flex-direction: column; gap: 8px; }
.day { width: 100%; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; gap: 12px; background: var(--surface); border-radius: 16px; padding: 12px 14px; text-align: left; min-height: 66px; }
button.day:active { background: var(--surface2); }
.d-date b { display: block; font-size: 19px; font-weight: 800; line-height: 1.1; }
.d-date span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.d-times { display: flex; flex-direction: column; gap: 2px; color: var(--clock); font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; min-width: 0; }
.d-times button { color: var(--clock); font-weight: 600; text-align: left; min-height: 34px; display: flex; align-items: center; }
.d-tot { text-align: right; }
.d-tot .h { font-size: 22px; color: var(--time); line-height: 1.15; }
.d-tot .m { font-size: 15px; color: var(--money); font-weight: 700; font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--clock); border: 1px solid var(--clock); border-radius: 6px; padding: 0 5px; margin-left: 6px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { min-height: 42px; border-radius: 9px; font-weight: 700; font-size: 16px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface2); color: var(--fg); box-shadow: 0 1px 0 rgba(255,255,255,.05) inset; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); padding: 0 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.formula { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.formula .t { color: var(--time); font-weight: 600; } .formula .e { color: var(--money); font-weight: 600; }

.total-line { background: var(--surface2); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 4px; }
.total-line .big { font-size: 22px; line-height: 1.25; }
.total-line .big b { color: var(--time); }
.pdf-btn { width: 100%; min-height: 54px; border-radius: 14px; background: var(--surface); color: var(--fg); font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid var(--line); }
.pdf-btn svg { width: 22px; height: 22px; color: var(--accent); }
.pdf-btn:active { background: var(--surface2); }
.total-line .small { font-size: 16px; color: var(--money); font-weight: 700; font-variant-numeric: tabular-nums; }

.empty { background: var(--surface); border-radius: 16px; padding: 28px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 6px; align-items: center; }
.empty b { color: var(--fg); font-size: 17px; }

/* Settings */
.group { background: var(--surface); border-radius: 16px; padding: 4px 16px; }
.field-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; }
.field-row + .field-row { border-top: 1px solid var(--line); }
.field-row label { font-weight: 600; }
.rate-wrap { display: flex; align-items: center; gap: 6px; }
.rate-wrap input { width: 110px; text-align: right; font-size: 22px; }
.rate-wrap span { color: var(--muted); }
.note { font-size: 14px; color: var(--muted); padding: 0 4px; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--accent); }

input { font: inherit; color: var(--fg); background: transparent; border: 0; }
input.num { font-family: var(--font-num); }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.4) blur(18px); -webkit-backdrop-filter: saturate(1.4) blur(18px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 10; }
.tabbar nav { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tab { min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); }
.tab svg { width: 26px; height: 26px; }
.tab[aria-current="page"] { color: var(--accent); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; opacity: 0; transition: opacity .2s; }
.scrim.open { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 560px; margin: 0 auto; background: var(--bg); border-radius: 22px 22px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); max-height: calc(100% - 24px); overflow-y: auto; }
.sheet.open { transform: none; }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 8px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.sheet-head h2 { margin: 0; font-size: 20px; font-weight: 800; }
.link { color: var(--accent); font-weight: 600; min-height: 44px; padding: 0 4px; }
.form { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.card-field { background: var(--surface); border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.card-field label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.card-field input { font-size: 24px; width: 100%; min-height: 40px; -webkit-appearance: none; appearance: none; text-align: left; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 18px; background: var(--bg); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.pause-row { display: flex; align-items: center; gap: 6px; }
.pause-row input { width: 80px; }
.pause-row span { color: var(--muted); }
.preview { background: var(--surface); border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.preview .num { font-size: 30px; color: var(--time); }
.preview .money { font-size: 18px; color: var(--money); font-weight: 700; font-variant-numeric: tabular-nums; }
.preview .why { width: 100%; font-size: 13px; color: var(--muted); }
.preview.bad { background: var(--danger-soft); }
.preview.bad .why { color: var(--danger); font-weight: 600; }
.del { width: 100%; min-height: 52px; border-radius: 14px; color: var(--danger); background: var(--surface); font-weight: 600; }
.del.confirm { background: var(--danger); color: #000; }
.cta[disabled] { opacity: .4; }

.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 15px; font-weight: 600; opacity: 0; transition: opacity .2s, transform .2s; z-index: 30; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) { .sheet, .scrim, .toast { transition: none; } }
@media (max-width: 360px) { .sum.hero .sum-time { font-size: 44px; } .top h1 { font-size: 30px; } }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.row-btn { width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: space-between; color: var(--accent); font-weight: 600; text-align: left; }
</style>
</head>
<body>

<main class="app" id="app" aria-live="polite"></main>

<div class="tabbar"><nav id="tabs" aria-label="Ansichten"></nav></div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grabber"></div>
  <div class="sheet-head">
    <button class="link" id="cancelBtn" type="button">Abbrechen</button>
    <h2 id="sheetTitle">Arbeitszeit</h2>
    <span style="width:84px"></span>
  </div>
  <form class="form" id="entryForm" novalidate>
    <div class="card-field">
      <label for="fDate">Datum</label>
      <input id="fDate" type="date" class="num" required>
    </div>
    <div class="pair">
      <div class="card-field">
        <label for="fStart">Beginn</label>
        <input id="fStart" type="time" class="num" required>
      </div>
      <div class="card-field">
        <label for="fEnd">Ende</label>
        <input id="fEnd" type="time" class="num" required>
      </div>
    </div>
    <div class="preview" id="preview"></div>
    <button class="cta" id="saveBtn" type="submit">Speichern</button>
    <button class="del" id="delBtn" type="button" hidden>Eintrag löschen</button>
  </form>
</section>

<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";

  /* ---------- helpers ---------- */
  const $ = (id) => document.getElementById(id);
  const WD_SHORT = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  const WD_LONG = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
  const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  const eur = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" });
  const pad = (n) => String(n).padStart(2, "0");

  function parseYMD(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); }
  function ymd(dt) { return dt.getFullYear() + "-" + pad(dt.getMonth() + 1) + "-" + pad(dt.getDate()); }
  function today() { return ymd(new Date()); }
  function addDays(s, n) { const d = parseYMD(s); d.setDate(d.getDate() + n); return ymd(d); }
  function mondayOf(s) { const d = parseYMD(s); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return ymd(d); }
  function isoWeek(s) {
    const d = parseYMD(s); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd + 3);
    const firstThu = new Date(d.getFullYear(), 0, 4, 12);
    const fwd = (firstThu.getDay() + 6) % 7; firstThu.setDate(firstThu.getDate() - fwd + 3);
    return 1 + Math.round((d - firstThu) / 604800000);
  }
  function dm(s) { const d = parseYMD(s); return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "."; }
  function dmy(s) { return dm(s) + parseYMD(s).getFullYear(); }
  function toMin(t) { if (!t || !/^\d{1,2}:\d{2}/.test(t)) return null; const [h, m] = t.split(":").map(Number); return h * 60 + m; }

  /* Worked minutes for one entry. End before/at-or-before start = next day. */
  function calc(e) {
    const s = toMin(e.start), en = toMin(e.end);
    if (s == null || en == null) return { ok: false, why: "Beginn und Ende eintragen." };
    if (s === en) return { ok: false, why: "Ende muss sich vom Beginn unterscheiden." };
    const overnight = en < s;
    const span = (overnight ? en + 1440 : en) - s;
    const pause = Math.max(0, Math.round(Number(e.pause) || 0));
    if (pause >= span) return { ok: false, why: "Die Pause ist länger als die Anwesenheit." };
    return { ok: true, min: span - pause, overnight, pause };
  }
  function hm(min) { const m = Math.max(0, Math.round(min)); return Math.floor(m / 60) + ":" + pad(m % 60); }
  function money(min) { return Math.round((min / 60) * state.rate * 100) / 100; }
  function moneyStr(min) { return state.rate > 0 ? eur.format(money(min)) : "–"; }
  function rateStr() { return eur.format(state.rate || 0); }

  /* ---------- state & storage ---------- */
  const LS = "stundenkonto.v1";
  const state = { entries: [], rate: 0, tab: "heute", weekStart: mondayOf(today()), month: today().slice(0, 7), synced: false };

  function loadCache() {
    try {
      const raw = localStorage.getItem(LS); if (!raw) return;
      const o = JSON.parse(raw);
      if (Array.isArray(o.entries)) state.entries = o.entries.filter(validShape);
      if (typeof o.rate === "number") state.rate = o.rate;
      state.synced = !!o.synced;
    } catch (_) {}
  }
  function saveCache() {
    try { localStorage.setItem(LS, JSON.stringify({ entries: state.entries, rate: state.rate, synced: state.synced })); } catch (_) {}
  }
  function validShape(e) { return e && typeof e.id === "string" && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && typeof e.start === "string" && typeof e.end === "string"; }
  function newId() { return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function persistEntry() { saveCache(); }
  function removeEntry() { saveCache(); }
  function persistRate() { saveCache(); }

  /* Ask the browser to keep this app's data permanently */
  function askPersist() { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (_) {} }

  /* ---------- backup ---------- */
  async function exportBackup() {
    const data = JSON.stringify({ app: "Stundenkonto", version: 1, exported: new Date().toISOString(), rate: state.rate, entries: state.entries }, null, 2);
    const name = "Stundenkonto-Backup-" + today() + ".json";
    const blob = new Blob([data], { type: "application/json" });
    try {
      const file = new File([blob], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: name });
        return;
      }
    } catch (err) { if (err && err.name === "AbortError") return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  function importBackup(file) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(r.result);
        const list = Array.isArray(o.entries) ? o.entries.filter(validShape) : null;
        if (!list) throw new Error();
        const map = new Map(state.entries.map((e) => [e.id, e]));
        list.forEach((e) => map.set(e.id, e));
        state.entries = [...map.values()];
        if (typeof o.rate === "number" && o.rate > 0) state.rate = o.rate;
        saveCache(); render();
        toast(list.length + " Einträge geladen");
      } catch (_) { toast("Diese Datei ist kein Stundenkonto-Backup"); }
    };
    r.readAsText(file);
  }


  /* ---------- PDF export (self-made, works offline, no library) ---------- */
  const W1252 = { "€": 0x80, "–": 0x96, "—": 0x97, "„": 0x84, "“": 0x93, "”": 0x94, "·": 0xB7, "×": 0xD7 };
  function hexStr(str) {
    let h = "";
    for (const ch of str) {
      let c = W1252[ch] != null ? W1252[ch] : ch.charCodeAt(0);
      if (c > 255) c = 63;
      h += c.toString(16).padStart(2, "0");
    }
    return "<" + h + ">";
  }
  /* Helvetica widths (1/1000 em) for the characters that are right-aligned */
  const WR = { " ": 278, ",": 278, ".": 278, ":": 278, "h": 556, "€": 556, "–": 556, "-": 333 };
  const WB = { " ": 278, ",": 278, ".": 278, ":": 333, "h": 611, "€": 556, "–": 556, "-": 333 };
  function textW(str, size, bold) { let w = 0; for (const ch of str) w += (/[0-9]/.test(ch) ? 556 : ((bold ? WB : WR)[ch] || 556)); return w * size / 1000; }
  function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255].map((v) => v.toFixed(3)).join(" "); }

  function buildMonthPDF(ym) {
    const [ms, me] = monthRange(ym);
    const [y, m] = ym.split("-").map(Number);
    const list = entriesBetween(ms, me).slice().sort((a, b) => a.date === b.date ? toMin(a.start) - toMin(b.start) : a.date < b.date ? -1 : 1);
    const totMin = totalMin(list);
    const nDays = new Set(list.map((e) => e.date)).size;
    const PW = 595.28, PH = 841.89, L = 48, R = PW - 48;
    const cols = { date: L + 8, start: 214, end: 280, time: 452, money: R - 8 };
    const pages = []; let ops = [];
    const txt = (x, y, s, size, o) => { o = o || {}; const bold = !!o.bold; let xx = x; if (o.right) xx = x - textW(s, size, bold);
      ops.push("BT /" + (bold ? "F2" : "F1") + " " + size + " Tf " + rgb(o.color || "#111111") + " rg " + xx.toFixed(2) + " " + y.toFixed(2) + " Td " + hexStr(s) + " Tj ET"); };
    const rect = (x, y, w, h, color) => ops.push(rgb(color) + " rg " + x.toFixed(2) + " " + y.toFixed(2) + " " + w.toFixed(2) + " " + h.toFixed(2) + " re f");
    const line = (x1, y1, x2, color, wd) => ops.push(rgb(color) + " RG " + (wd || .6) + " w " + x1 + " " + y1.toFixed(2) + " m " + x2 + " " + y1.toFixed(2) + " l S");

    const ROW = 22;
    function tableHead(y) {
      rect(L, y - 7, R - L, ROW, "#111111");
      txt(cols.date, y, "Datum", 10, { bold: true, color: "#FFFFFF" });
      txt(cols.start, y, "Beginn", 10, { bold: true, color: "#BDBDBD" });
      txt(cols.end, y, "Ende", 10, { bold: true, color: "#BDBDBD" });
      txt(cols.time, y, "Arbeitszeit", 10, { bold: true, color: "#FFFFFF", right: true });
      txt(cols.money, y, "Verdienst", 10, { bold: true, color: "#89CFF0", right: true });
      return y - ROW;
    }
    function newPage(first) {
      if (ops.length) pages.push(ops);
      ops = [];
      let y = PH - 64;
      if (first) {
        txt(L, y, "Arbeitszeitnachweis", 22, { bold: true });
        y -= 24; txt(L, y, MONTHS[m - 1] + " " + y4(), 14, { color: "#555555" });
        y -= 34;
        const boxW = (R - L - 16) / 3;
        const boxes = [["Arbeitstage", String(nDays), "#111111"], ["Arbeitszeit", hm(totMin) + " h", "#000000"], ["Verdienst", state.rate > 0 ? eur.format(money(totMin)) : "–", "#2A86B4"]];
        boxes.forEach((b, i) => { const x = L + i * (boxW + 8); rect(x, y - 30, boxW, 50, "#F0F0F0");
          txt(x + 12, y + 6, b[0].toUpperCase(), 8, { bold: true, color: "#777777" }); txt(x + 12, y - 16, b[1], 16, { bold: true, color: b[2] }); });
        y -= 54;
        txt(L, y, (state.rate > 0 ? "Stundenlohn: " + rateStr() + "   ·   " : "") + "Erstellt am " + dmy(today()), 9, { color: "#777777" });
        y -= 28;
      } else {
        txt(L, y, "Arbeitszeitnachweis " + MONTHS[m - 1] + " " + y4() + " (Fortsetzung)", 11, { bold: true, color: "#555555" });
        y -= 26;
      }
      return tableHead(y);
    }
    function y4() { return String(y); }

    let yy = newPage(true);
    if (!list.length) { txt(cols.date, yy - 4, "Keine Einträge in diesem Monat.", 10, { color: "#777777" }); yy -= ROW; }
    list.forEach((e, i) => {
      if (yy < 96) yy = newPage(false);
      const c = calc(e); const d = parseYMD(e.date);
      if (i % 2 === 1) rect(L, yy - 7, R - L, ROW, "#EEF7FC");
      txt(cols.date, yy, WD_SHORT[d.getDay()] + ", " + dmy(e.date), 10);
      txt(cols.start, yy, e.start, 10);
      txt(cols.end, yy, e.end + (c.overnight ? " (+1)" : ""), 10);
      txt(cols.time, yy, hm(c.min || 0) + " h", 10, { right: true });
      txt(cols.money, yy, state.rate > 0 ? eur.format(money(c.min || 0)) : "–", 10, { right: true });
      yy -= ROW;
    });
    if (yy < 80) yy = newPage(false);
    line(L, yy + ROW - 7, R, "#111111", 1.2);
    txt(cols.date, yy + 2, "Gesamt gearbeitet", 11, { bold: true });
    txt(cols.time, yy + 2, hm(totMin) + " h", 11, { bold: true, color: "#000000", right: true });
    txt(cols.money, yy + 2, state.rate > 0 ? eur.format(money(totMin)) : "–", 11, { bold: true, color: "#2A86B4", right: true });
    pages.push(ops);

    /* assemble the PDF file */
    const objs = [];
    const add = (body) => { objs.push(body); return objs.length; };
    const catalog = add(""), pagesObj = add("");
    const f1 = add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
    const f2 = add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
    const kids = [];
    pages.forEach((p, i) => {
      const foot = [];
      const saved = ops; ops = foot;
      line(L, 44, R, "#D6D6D6", .6);
      txt(L, 30, "Stundenkonto · " + MONTHS[m - 1] + " " + y4(), 8, { color: "#888888" });
      const pn = "Seite " + (i + 1) + " von " + pages.length;
      txt(R - pn.length * 4.4, 30, pn, 8, { color: "#888888" });
      ops = saved;
      const stream = p.concat(foot).join("\n");
      const cs = add("<< /Length " + stream.length + " >>\nstream\n" + stream + "\nendstream");
      kids.push(add("<< /Type /Page /Parent " + pagesObj + " 0 R /MediaBox [0 0 " + PW + " " + PH + "] /Resources << /Font << /F1 " + f1 + " 0 R /F2 " + f2 + " 0 R >> >> /Contents " + cs + " 0 R >>"));
    });
    objs[catalog - 1] = "<< /Type /Catalog /Pages " + pagesObj + " 0 R >>";
    objs[pagesObj - 1] = "<< /Type /Pages /Kids [" + kids.map((k) => k + " 0 R").join(" ") + "] /Count " + kids.length + " >>";
    let out = "%PDF-1.4\n"; const offs = [];
    objs.forEach((b, i) => { offs.push(out.length); out += (i + 1) + " 0 obj\n" + b + "\nendobj\n"; });
    const xref = out.length;
    out += "xref\n0 " + (objs.length + 1) + "\n0000000000 65535 f \n" + offs.map((o) => String(o).padStart(10, "0") + " 00000 n \n").join("");
    out += "trailer\n<< /Size " + (objs.length + 1) + " /Root " + catalog + " 0 R >>\nstartxref\n" + xref + "\n%%EOF";
    const bytes = new Uint8Array(out.length);
    for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 255;
    return bytes;
  }

  async function exportMonthPDF() {
    const name = "Arbeitszeiten-" + MONTHS[Number(state.month.slice(5)) - 1] + "-" + state.month.slice(0, 4) + ".pdf";
    let blob;
    try { blob = new Blob([buildMonthPDF(state.month)], { type: "application/pdf" }); }
    catch (_) { toast("PDF konnte nicht erstellt werden"); return; }
    try {
      const file = new File([blob], name, { type: "application/pdf" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
    } catch (err) { if (err && err.name === "AbortError") return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  /* ---------- aggregation ---------- */
  function entriesBetween(from, to) { return state.entries.filter((e) => e.date >= from && e.date <= to); }
  function byDay(list) {
    const map = new Map();
    list.slice().sort((a, b) => a.date === b.date ? (toMin(a.start) - toMin(b.start)) : a.date < b.date ? -1 : 1)
      .forEach((e) => { if (!map.has(e.date)) map.set(e.date, []); map.get(e.date).push(e); });
    return [...map.entries()].map(([date, es]) => ({ date, entries: es, min: es.reduce((s, e) => s + (calc(e).min || 0), 0) }));
  }
  function totalMin(list) { return list.reduce((s, e) => s + (calc(e).min || 0), 0); }
  function monthRange(ym) {
    const [y, m] = ym.split("-").map(Number);
    const last = new Date(y, m, 0, 12).getDate();
    return [ym + "-01", ym + "-" + pad(last)];
  }

  /* ---------- icons ---------- */
  const I = {
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
    chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
    heute: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
    woche: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M7.5 14.5h9"/></svg>',
    monat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 13.5h.01M12 13.5h.01M16 13.5h.01M8 16.8h.01M12 16.8h.01" stroke-width="2.6"/></svg>',
    einstellungen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>'
  };
  I.uebersicht = I.monat;
  I.doc = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 17v-6M9 14l3 3 3-3"/></svg>';
  const TABS = [["heute", "Eintragen"], ["uebersicht", "Übersicht"], ["einstellungen", "Einstellungen"]];
  const PK = "stundenkonto.period";
  try { const p = localStorage.getItem(PK); if (p === "woche" || p === "monat") state.period = p; } catch (_) {}
  if (!state.period) state.period = "woche";

  /* ---------- rendering ---------- */
  function timeHTML(min, cls) { return '<span class="num ' + cls + '">' + hm(min) + '<span class="unit">h</span></span>'; }
  function rateHint() {
    return state.rate > 0 ? "" : '<div class="hint">Noch kein Stundenlohn hinterlegt. <button type="button" data-go="einstellungen">Jetzt festlegen</button></div>';
  }
  function times(e) { return '<span>' + e.start + ' – ' + e.end + (calc(e).overnight ? '<span class="tag">+1 Tag</span>' : '') + '</span>'; }

  function dayGroup(day) {
    const d = parseYMD(day.date);
    const date = '<div class="d-date"><b>' + WD_SHORT[d.getDay()] + '</b><span>' + dm(day.date) + '</span></div>';
    const tot = '<div class="d-tot"><div class="num h">' + hm(day.min) + ' h</div><div class="m">' + moneyStr(day.min) + '</div></div>';
    if (day.entries.length === 1) {
      const e = day.entries[0];
      return '<button class="day" type="button" data-edit="' + e.id + '" aria-label="' + WD_LONG[d.getDay()] + ' ' + dmy(day.date) + ' bearbeiten">' +
        date + '<div class="d-times">' + times(e) + '</div>' + tot + '</button>';
    }
    return '<div class="day">' + date + '<div class="d-times">' +
      day.entries.map((e) => '<button type="button" data-edit="' + e.id + '">' + times(e) + '</button>').join("") + '</div>' + tot + '</div>';
  }

  const LEGEND = '<div class="legend"><span><i style="background:var(--clock)"></i>Uhrzeit</span><span><i style="background:var(--time)"></i>Arbeitszeit</span><span><i style="background:var(--money)"></i>Verdienst</span></div>';

  /* Start screen = the entry form itself */
  let draft = null;
  function freshDraft() { return { date: today(), start: "", end: "" }; }
  function previewParts(e) {
    const c = calc(Object.assign({ pause: 0 }, e));
    if (!e.start || !e.end) return { ok: false, cls: "preview", html: '<span class="num">0:00 h</span>' + (state.rate > 0 ? '<span class="money">' + eur.format(0) + '</span>' : '') };
    if (!e.date) return { ok: false, cls: "preview bad", html: '<span class="why">Bitte ein Datum wählen.</span>' };
    if (!c.ok) return { ok: false, cls: "preview bad", html: '<span class="why">' + c.why + '</span>' };
    return { ok: true, c: c, cls: "preview", html: '<span class="num">' + hm(c.min) + ' h</span>' +
      (state.rate > 0 ? '<span class="money">' + eur.format(money(c.min)) + '</span>' : '') +
      (c.overnight ? '<span class="why">Endet am nächsten Tag (über Mitternacht).</span>' : '') };
  }
  function refreshStartPreview() {
    const p = $("sPreview"); if (!p) return;
    const r = previewParts(draft);
    p.className = r.cls; p.innerHTML = r.html; $("sSave").disabled = !r.ok;
  }
  function renderHeute() {
    if (!draft) draft = freshDraft();
    const d = parseYMD(today());
    const r = previewParts(draft);
    return '<div class="screen">' +
      '<div class="top"><div><h1>Eintragen</h1><div class="sub">' + WD_LONG[d.getDay()] + ", " + dmy(today()) + '</div></div></div>' +
      rateHint() +
      '<form class="form" id="startForm" novalidate>' +
      '<div class="card-field"><label for="sDate">Datum</label><input id="sDate" type="date" class="num" value="' + draft.date + '" required></div>' +
      '<div class="pair">' +
      '<div class="card-field"><label for="sStart">Beginn</label><input id="sStart" type="time" class="num" value="' + draft.start + '" required></div>' +
      '<div class="card-field"><label for="sEnd">Ende</label><input id="sEnd" type="time" class="num" value="' + draft.end + '" required></div>' +
      '</div>' +
      '<div class="' + r.cls + '" id="sPreview">' + r.html + '</div>' +
      '<button class="cta" id="sSave" type="submit"' + (r.ok ? '' : ' disabled') + '>Speichern</button>' +
      '</form></div>';
  }

  function periodSummary(min, days) {
    return '<div class="sum"><div class="sum-label"><span>Gesamt</span><span>' + days + (days === 1 ? " Arbeitstag" : " Arbeitstage") + '</span></div>' +
      '<div class="sum-row">' + timeHTML(min, "sum-time") + '<span class="num sum-money">' + moneyStr(min) + '</span></div>' +
      (state.rate > 0 ? '<div class="formula"><span class="t">' + hm(min) + ' h</span> × ' + rateStr() + ' = <span class="e">' + eur.format(money(min)) + '</span></div>' : '') + '</div>';
  }

  function header(addDate) {
    return '<div class="top"><div><h1>Übersicht</h1></div>' +
      '<button class="round" type="button" data-add="' + addDate + '" aria-label="Arbeitszeit hinzufügen">' + I.plus + '</button></div>' +
      '<div class="seg" role="group" aria-label="Zeitraum">' +
      '<button type="button" data-period="woche" aria-pressed="' + (state.period === "woche") + '">Woche</button>' +
      '<button type="button" data-period="monat" aria-pressed="' + (state.period === "monat") + '">Monat</button></div>';
  }

  function renderWoche() {
    const ws = state.weekStart, we = addDays(ws, 6);
    const days = byDay(entriesBetween(ws, we));
    const min = days.reduce((s, x) => s + x.min, 0);
    const isNow = ws === mondayOf(today());
    return '<div class="screen">' + header(isNow ? today() : ws) +
      '<div class="pager"><button class="arrow" type="button" data-week="-1" aria-label="Vorige Woche">' + I.left + '</button>' +
      '<button class="mid" type="button" data-week="0"><b>KW ' + isoWeek(ws) + ' · ' + dm(ws) + ' – ' + dm(we) + '</b><small>' + (isNow ? "diese Woche" : "zur aktuellen Woche") + '</small></button>' +
      '<button class="arrow" type="button" data-week="1" aria-label="Nächste Woche">' + I.right + '</button></div>' +
      rateHint() + periodSummary(min, days.length) +
      (days.length ? '<div class="days">' + days.map(dayGroup).join("") + '</div>'
        : '<div class="empty"><b>Keine Einträge in dieser Woche</b>Tippe auf + und trage deine Arbeitszeit ein.</div>') +
      '</div>';
  }

  function renderMonat() {
    const ym = state.month, [ms, me] = monthRange(ym);
    const days = byDay(entriesBetween(ms, me));
    const min = days.reduce((s, x) => s + x.min, 0);
    const [y, m] = ym.split("-").map(Number);
    const isNow = ym === today().slice(0, 7);
    return '<div class="screen">' + header(isNow ? today() : ms) +
      '<div class="pager"><button class="arrow" type="button" data-month="-1" aria-label="Voriger Monat">' + I.left + '</button>' +
      '<button class="mid" type="button" data-month="0"><b>' + MONTHS[m - 1] + " " + y + '</b><small>' + (isNow ? "dieser Monat" : "zum aktuellen Monat") + '</small></button>' +
      '<button class="arrow" type="button" data-month="1" aria-label="Nächster Monat">' + I.right + '</button></div>' +
      rateHint() + periodSummary(min, days.length) +
      (days.length ? '<div class="days">' + days.map(dayGroup).join("") + '</div>'
        : '<div class="empty"><b>Keine Einträge in diesem Monat</b>Tippe auf + und trage deine Arbeitszeit ein.</div>') +
      '<div class="total-line"><span class="num big">Gesamt gearbeitet: <b>' + hm(min) + ' Stunden</b></span>' +
      (state.rate > 0 ? '<span class="small">Verdienst: ' + eur.format(money(min)) + '</span>' : '') + '</div>' +
      '<button class="pdf-btn" type="button" data-pdf="1">' + I.doc + 'Monat als PDF exportieren</button>' +
      '</div>';
  }

  function renderSettings() {
    const val = state.rate > 0 ? state.rate.toFixed(2).replace(".", ",") : "";
    return '<div class="screen">' +
      '<div class="top"><div><h1>Einstellungen</h1></div></div>' +
      '<div class="group"><div class="field-row"><label for="rate">Stundenlohn</label>' +
      '<div class="rate-wrap"><input id="rate" class="num" type="text" inputmode="decimal" placeholder="0,00" value="' + val + '" autocomplete="off"><span>€ / h</span></div></div></div>' +
      '<p class="note">Der Verdienst wird aus der Arbeitszeit berechnet: Stunden und Minuten × Stundenlohn. Eine Änderung gilt für alle Einträge.</p>' +
      '<div class="group"><div class="field-row"><span>Einträge gesamt</span><span class="num">' + state.entries.length + '</span></div>' +
      '<div class="field-row"><span>Speicherort</span><span class="status"><span class="dot on"></span>Nur dieses iPhone</span></div></div>' +
      '<div class="section-title">Datensicherung</div>' +
      '<div class="group"><button class="field-row row-btn" type="button" data-export="1">Backup erstellen' + I.chev + '</button>' +
      '<label class="field-row row-btn file-btn" for="importFile">Backup laden' + I.chev + '<input id="importFile" type="file" accept="application/json,.json"></label></div>' +
      '<p class="note">Deine Einträge bleiben nur auf diesem iPhone. Erstelle ab und zu ein Backup und lege es in „Dateien“ oder iCloud ab. Mit „Backup laden“ holst du es zurück, auch auf einem neuen iPhone.</p>' +
      '</div>';
  }

  function render() {
    const app = $("app");
    if (document.activeElement && document.activeElement.id === "rate") return; // don't clobber typing
    app.innerHTML = state.tab === "uebersicht" ? (state.period === "monat" ? renderMonat() : renderWoche()) : state.tab === "einstellungen" ? renderSettings() : renderHeute();
    $("tabs").innerHTML = TABS.map(([k, label]) =>
      '<button class="tab" type="button" data-tab="' + k + '"' + (state.tab === k ? ' aria-current="page"' : '') + '>' + I[k] + label + '</button>').join("");
  }

  /* ---------- sheet ---------- */
  let editing = null, delArmed = false;

  function lastEntry() {
    return state.entries.slice().sort((a, b) => (a.updated || 0) - (b.updated || 0)).pop();
  }

  function openSheet(opts) {
    editing = opts.id ? state.entries.find((e) => e.id === opts.id) || null : null;
    const base = editing || lastEntry();
    $("sheetTitle").textContent = editing ? "Bearbeiten" : "Arbeitszeit";
    $("fDate").value = editing ? editing.date : (opts.date || today());
    $("fStart").value = base ? base.start : "08:00";
    $("fEnd").value = base ? base.end : "16:30";
    $("delBtn").hidden = !editing;
    disarmDelete();
    updatePreview();
    $("scrim").hidden = false; $("sheet").hidden = false;
    requestAnimationFrame(() => { $("scrim").classList.add("open"); $("sheet").classList.add("open"); });
  }
  function closeSheet() {
    $("scrim").classList.remove("open"); $("sheet").classList.remove("open");
    setTimeout(() => { $("scrim").hidden = true; $("sheet").hidden = true; }, 260);
    editing = null;
  }
  function formEntry() {
    return { date: $("fDate").value, start: $("fStart").value, end: $("fEnd").value, pause: editing ? (Number(editing.pause) || 0) : 0 };
  }
  function updatePreview() {
    const e = formEntry();
    const c = calc(e);
    const p = $("preview");
    if (!e.date) { p.className = "preview bad"; p.innerHTML = '<span class="why">Bitte ein Datum wählen.</span>'; $("saveBtn").disabled = true; return; }
    if (!c.ok) { p.className = "preview bad"; p.innerHTML = '<span class="why">' + c.why + '</span>'; $("saveBtn").disabled = true; return; }
    p.className = "preview";
    p.innerHTML = '<span class="num">' + hm(c.min) + ' h</span>' +
      (state.rate > 0 ? '<span class="money">' + hm(c.min) + ' h × ' + rateStr() + ' = ' + eur.format(money(c.min)) + '</span>' : '') +
      (c.overnight ? '<span class="why">Endet am nächsten Tag (über Mitternacht).</span>' : '');
    $("saveBtn").disabled = false;
  }
  function disarmDelete() { delArmed = false; $("delBtn").classList.remove("confirm"); $("delBtn").textContent = "Eintrag löschen"; }

  /* ---------- events ---------- */
  document.addEventListener("click", (ev) => {
    const t = ev.target.closest("button"); if (!t) return;
    if (t.dataset.tab) { if (t.dataset.tab === "heute" && state.tab !== "heute") draft = null; state.tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.go) { state.tab = t.dataset.go; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.add !== undefined) { openSheet({ date: t.dataset.add }); return; }
    if (t.dataset.edit) { openSheet({ id: t.dataset.edit }); return; }
    if (t.dataset.week !== undefined) {
      const n = Number(t.dataset.week);
      state.weekStart = n === 0 ? mondayOf(today()) : addDays(state.weekStart, 7 * n); render(); return;
    }
    if (t.dataset.month !== undefined) {
      const n = Number(t.dataset.month);
      if (n === 0) state.month = today().slice(0, 7);
      else { const [y, m] = state.month.split("-").map(Number); const d = new Date(y, m - 1 + n, 1, 12); state.month = d.getFullYear() + "-" + pad(d.getMonth() + 1); }
      render(); return;
    }
    if (t.dataset.export) { exportBackup(); return; }
    if (t.dataset.pdf) { exportMonthPDF(); return; }
    if (t.dataset.period) { state.period = t.dataset.period; try { localStorage.setItem("stundenkonto.period", state.period); } catch (_) {} render(); return; }
  });

  $("scrim").addEventListener("click", closeSheet);
  $("cancelBtn").addEventListener("click", closeSheet);
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && !$("sheet").hidden) closeSheet(); });
  ["fDate", "fStart", "fEnd"].forEach((id) => { $(id).addEventListener("input", updatePreview); $(id).addEventListener("change", updatePreview); });

  function onStartInput(ev) {
    const id = ev.target.id;
    if (id !== "sDate" && id !== "sStart" && id !== "sEnd") return;
    draft[id === "sDate" ? "date" : id === "sStart" ? "start" : "end"] = ev.target.value;
    refreshStartPreview();
  }
  document.addEventListener("input", onStartInput);
  document.addEventListener("change", onStartInput);
  document.addEventListener("submit", (ev) => {
    if (ev.target.id !== "startForm") return;
    ev.preventDefault();
    const r = previewParts(draft); if (!r.ok) return;
    const entry = { id: newId(), date: draft.date, start: draft.start, end: draft.end, pause: 0, updated: Date.now() };
    state.entries.push(entry);
    persistEntry(entry);
    draft = freshDraft();
    render();
    const dd = parseYMD(entry.date);
    toast("Gespeichert: " + WD_SHORT[dd.getDay()] + " " + dm(entry.date) + " · " + hm(r.c.min) + " h" + (state.rate > 0 ? " · " + eur.format(money(r.c.min)) : ""));
  });

  $("entryForm").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const f = formEntry(); const c = calc(f);
    if (!f.date || !c.ok) { updatePreview(); return; }
    const entry = Object.assign({ id: editing ? editing.id : newId() }, f, { updated: Date.now() });
    const i = state.entries.findIndex((e) => e.id === entry.id);
    if (i >= 0) state.entries[i] = entry; else state.entries.push(entry);
    const wasEdit = !!editing;
    closeSheet(); render();
    toast((wasEdit ? "Geändert: " : "Gespeichert: ") + hm(c.min) + " h" + (state.rate > 0 ? " · " + eur.format(money(c.min)) : ""));
    persistEntry(entry);
  });

  $("delBtn").addEventListener("click", () => {
    if (!editing) return;
    if (!delArmed) { delArmed = true; $("delBtn").classList.add("confirm"); $("delBtn").textContent = "Wirklich löschen?"; return; }
    const id = editing.id;
    state.entries = state.entries.filter((e) => e.id !== id);
    closeSheet(); render(); toast("Eintrag gelöscht");
    removeEntry(id);
  });

  function commitRate(input) {
    const v = parseFloat(String(input.value).replace(/\./g, "").replace(",", ".").replace(/[^\d.]/g, ""));
    const r = Number.isFinite(v) && v >= 0 ? Math.round(v * 100) / 100 : 0;
    if (r !== state.rate) { state.rate = r; persistRate(); toast("Stundenlohn: " + eur.format(r)); }
    input.value = r > 0 ? r.toFixed(2).replace(".", ",") : "";
  }
  document.addEventListener("change", (ev) => {
    if (ev.target.id === "rate") commitRate(ev.target);
    if (ev.target.id === "importFile" && ev.target.files && ev.target.files[0]) { importBackup(ev.target.files[0]); ev.target.value = ""; }
  });
  document.addEventListener("keydown", (ev) => { if (ev.target.id === "rate" && ev.key === "Enter") ev.target.blur(); });
  document.addEventListener("focusout", (ev) => { if (ev.target.id === "rate") setTimeout(render, 0); });

  let toastTimer;
  function toast(msg) {
    const el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
  }

  /* Refresh "today" when the app comes back after midnight */
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    const a = document.activeElement;
    if (a && /^s(Date|Start|End)$/.test(a.id)) return;
    if (draft && !draft.start && !draft.end) draft.date = today();
    render();
  });

  loadCache();
  render();
  askPersist();
})();
</script>
</body>
</html>
